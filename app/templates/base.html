<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block titolo %}{{ NOME_APP }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  {% if utente %}
  <header class="container">
    <nav>
      <ul>
        <li><a href="/" class="marchio contrast">Europrojecta <small>Studio</small></a></li>
      </ul>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/clienti">Clienti</a></li>
        <li><a href="/pratiche">Pratiche</a></li>
        <li><a href="/scadenzario">Scadenzario</a></li>
        <li><a href="/bandi">Bandi</a></li>
        <li><a href="/modelli">Modelli</a></li>
        <li><a href="/fonti">Fonti</a></li>
        {% if utente.is_titolare %}<li><a href="/impostazioni/integrazioni">Impostazioni</a></li>{% endif %}
        <li><a href="/account">Account</a></li>
        <li>
          <form method="post" action="/logout" class="esci">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="secondary outline">Esci</button>
          </form>
        </li>
      </ul>
    </nav>
  </header>
  {% endif %}
  <main class="container">
    {% block contenuto %}{% endblock %}
  </main>
</body>
</html>
