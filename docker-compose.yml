# Sviluppo locale: database con pgvector, app web, worker.
# In produzione si aggiunge docker-compose.prod.yml (Caddy e backup) in fase 7.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-europrojecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: ${POSTGRES_DB:-europrojecta}
    volumes:
      - dati_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-europrojecta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-europrojecta}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - allegati:/srv/dati/allegati
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-europrojecta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-europrojecta}
    command: python -m app.jobs.worker
    volumes:
      - allegati:/srv/dati/allegati
    depends_on:
      app:
        condition: service_started

volumes:
  dati_db:
  # File caricati nelle pratiche: da includere nei backup (fase 7)
  allegati:
