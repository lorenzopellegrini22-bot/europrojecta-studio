name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/postgres
      SECRET_KEY: chiave-solo-per-la-ci-lunga-almeno-trentadue-caratteri
      AMBIENTE: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Librerie per i PDF (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core tesseract-ocr tesseract-ocr-ita
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest (unit + integrazione su Postgres reale)
        run: uv run pytest
      - name: Build immagine Docker
        run: docker build -f docker/Dockerfile -t europrojecta-studio:ci .

  produzione:
    # Controlla i file della messa in produzione: compose, Caddy e un backup vero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose di produzione valido
        run: |
          touch .env
          POSTGRES_PASSWORD=x DOMINIO=studio.esempio.test BACKUP_PASSPHRASE=y \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Caddyfile valido
        run: |
          docker run --rm -e DOMINIO=studio.esempio.test -e EMAIL_CERTIFICATI=ci@esempio.test \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Backup restic e prova di ripristino
        run: |
          docker build -f docker/backup.Dockerfile -t europrojecta-backup:ci .
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=ci pgvector/pgvector:pg16
          for i in $(seq 30); do docker exec db pg_isready -U postgres && break; sleep 2; done
          docker exec db psql -U postgres -c "create table azienda (id int, nome text); insert into azienda values (1, 'Prova');"
          mkdir -p backup allegati && echo "allegato di prova" > allegati/a.txt
          AMB="--network ci -e PGHOST=db -e PGUSER=postgres -e PGPASSWORD=ci -e PGDATABASE=postgres -e RESTIC_REPOSITORY=/backup/restic -e RESTIC_PASSWORD=segreta -v $PWD/allegati:/dati/allegati:ro -v $PWD/backup:/backup"
          docker run --rm $AMB europrojecta-backup:ci /usr/local/bin/backup.sh ora
          docker run --rm $AMB europrojecta-backup:ci /usr/local/bin/backup.sh ora
          docker run --rm $AMB europrojecta-backup:ci /usr/local/bin/backup.sh verifica | tee verifica.log
          grep -q "prova di ripristino riuscita: 1 tabelle, 1 aziende" verifica.log
          docker run --rm $AMB europrojecta-backup:ci restic ls latest --tag allegati | grep -q "/dati/allegati/a.txt"
          # senza la passphrase giusta il repository non si apre
          ! docker run --rm $AMB -e RESTIC_PASSWORD=sbagliata europrojecta-backup:ci restic snapshots
